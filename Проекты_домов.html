
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инструкция для нового сотрудника</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f9fafb;
      padding: 2rem;
      line-height: 1.6;
    }
    .container {
      max-width: 56rem;
      margin: 0 auto;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 3rem;
    }
    .header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid #e5e7eb;
    }
    h1 {
      font-size: 2rem;
      font-weight: bold;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    .date {
      color: #6b7280;
      font-size: 0.875rem;
    }
    .step {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .step:last-child {
      border-bottom: none;
    }
    .step-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .step-number {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      background: #2563eb;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
    }
    .step-content {
      flex: 1;
    }
    .step-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    .step-description {
      color: #374151;
      white-space: pre-wrap;
      margin-bottom: 1rem;
      word-wrap: break-word;
    }
    .step-description a {
      color: #2563eb;
      text-decoration: underline;
    }
    .step-description a:hover {
      color: #1d4ed8;
    }
    .step-screenshots {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .introduction {
      color: #374151;
      white-space: pre-wrap;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #f9fafb;
      border-radius: 0.5rem;
      line-height: 1.8;
    }
    .introduction a {
      color: #2563eb;
      text-decoration: underline;
    }
    .introduction a:hover {
      color: #1d4ed8;
    }
    .html-code {
      background: #f3f4f6;
      color: #1f2937;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
    }
    .code-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      position: relative;
    }
    .copy-btn {
      padding: 0.125rem;
      background: transparent;
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .code-wrapper:hover .copy-btn {
      opacity: 1;
    }
    .copy-btn:hover {
      background: #e5e7eb;
      border-radius: 0.25rem;
    }
    .copy-icon {
      width: 14px;
      height: 14px;
      color: #4b5563;
    }
    .copied {
      color: #10b981;
    }
    .step-screenshot {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      margin-bottom: 1rem;
    }
    .step-video {
      max-width: 100%;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      margin-bottom: 1rem;
    }
    .step-file {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: #f3f4f6;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: #374151;
    }
    .file-icon {
      width: 1.25rem;
      height: 1.25rem;
    }
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Инструкция для нового сотрудника</h1>
      <div class="date">Создано: 15 апреля 2026 г.</div>
    </div>
    <div class="introduction">рь</div>
    
      <div class="step">
        <div class="step-header">
          <div class="step-number">1</div>
          <div class="step-content">
            <div class="step-title">рьр</div>
            <div class="step-description">рьр</div>
            
            
            
              <iframe
                src="https://drive.google.com/file/d/1JMiZwN7g_sGG8XPizLHrEridSk_vhI1W/preview"
                class="step-video"
                style="aspect-ratio: 16/9; width: 100%;"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
            
          </div>
        </div>
      </div>
    
  </div>
  <script>
    function copyCode(button, codeId) {
      // Find the code element (previous sibling of the button)
      const codeElement = button.previousElementSibling;
      if (!codeElement) return;

      // Get the text content and decode HTML entities
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = codeElement.innerHTML;
      const codeText = tempDiv.textContent || tempDiv.innerText;

      // Copy to clipboard
      navigator.clipboard.writeText(codeText).then(() => {
        // Change icon to checkmark
        button.innerHTML = '<svg class="copy-icon copied" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';

        // Reset after 2 seconds
        setTimeout(() => {
          button.innerHTML = '<svg class="copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>';
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy:', err);
      });
    }
  </script>
</body>
</html>
